name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mahyar NFC v2
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: MahyarNFC-v2.0.0-GitHub-Ready

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v2 repository layout
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build v2 debug APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify v2 APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: MahyarNFC-v2.0.0-debug-apk
          path: |
            MahyarNFC-v2.0.0-GitHub-Ready/app/build/outputs/apk/debug/app-debug.apk
            MahyarNFC-v2.0.0-GitHub-Ready/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
